<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ShardexFps Duty</title>
<style>
:root{--bg:#0b0b0d;--p:#17181c;--fg:#f4f4f5;--ac:#ff7a00;--s:1;--o:.6;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(100deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.6) 42%,rgba(0,0,0,.05) 100%);z-index:5;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);text-align:center}
.scr.on{display:flex}
#pause{background:rgba(0,0,0,.72);backdrop-filter:blur(6px);z-index:6}
#rot{z-index:99;background:#05070d}
h1{margin:0 0 14px;font:italic 900 clamp(30px,7vw,58px)/.95 Impact,'Arial Black',sans-serif;letter-spacing:2px;color:#fff;text-shadow:0 0 20px var(--ac),3px 3px 0 #000}h1 b{color:var(--ac)}
#menu{align-items:flex-start;text-align:left;padding-left:max(6vw,env(safe-area-inset-left))}#menu #box{width:min(420px,92%)}
.vmenu{display:flex;flex-direction:column;gap:8px;width:min(300px,80vw)}
.vmenu button{background:rgba(18,18,22,.8);border:0;border-left:6px solid var(--ac);border-radius:0;font-size:17px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:12px 18px;min-width:0;justify-content:flex-start;transform:skewX(-9deg)}
.vmenu button:hover{background:var(--ac);color:#000}.vmenu .pri{background:var(--ac);color:#000}
h3{margin:6px 0}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:640px}
button{background:var(--p);color:var(--fg);border:1px solid #2b3a5e;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
button:hover,button.act{border-color:var(--ac)}
button.act{background:#4a2400}
.big{font-size:18px;padding:14px 22px;min-width:150px;justify-content:center}
.pri{background:var(--ac);color:#04121a;font-weight:700}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#box{max-height:92%;overflow:auto;width:min(600px,96%)}
.card{background:var(--p);border:1px solid #2b3a5e;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
input[type=text],input[type=password]{background:#0b1222;color:var(--fg);border:1px solid #2b3a5e;border-radius:8px;padding:10px;font:inherit;width:100%;user-select:text}
input[type=range]{width:160px}
.m{color:#94a3b8;font-size:13px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:6px}
#hud{display:none;position:fixed;inset:0;pointer-events:none;z-index:3}
body.run #hud,body.edit #hud{display:block}
#cross{position:fixed;left:50%;top:50%;width:24px;height:24px;margin:-12px;border:2px solid #fff;border-radius:50%;display:none;z-index:3}
#cross::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:inherit}
#cross.r{border-color:#ff2d2d;box-shadow:0 0 10px #ff2d2d;background:rgba(255,45,45,.15)}
body.run #cross{display:block}
#st{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top));font-weight:700;text-shadow:0 1px 3px #000;display:none;z-index:3}
body.run #st,body.run #mb{display:block}
#mb{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top));display:none;z-index:4}
#hurt{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none;z-index:2;transition:opacity .25s}
#done{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:20;display:none}
body.edit #done{display:block}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;z-index:3;font-weight:800}
body.run #top,body.run #hp,body.run #feed{display:flex}
.tb{display:flex;align-items:center;gap:6px;font-size:24px}.tb span{min-width:34px;text-align:center;text-shadow:0 2px 4px #000}
.tb i{display:block;width:clamp(80px,22vw,200px);height:10px;background:rgba(0,0,0,.55);transform:skewX(-20deg);overflow:hidden}.tb b{display:block;height:100%;width:0;transition:width .2s}
#bf{background:#3b82f6}#rf{background:#ef4444;float:right}#bs{color:#6aa8ff}#rs{color:#ff6b5e}
.vs{background:rgba(0,0,0,.6);padding:2px 10px;font-size:12px;border:1px solid #555;white-space:nowrap}.vs span{font-size:14px}
#hp{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));display:none;align-items:center;gap:10px;z-index:3;font-weight:800;font-size:24px;text-shadow:0 2px 4px #000}
#hpb{width:clamp(130px,28vw,240px);height:16px;background:rgba(0,0,0,.6);border:2px solid #fff;transform:skewX(-20deg);overflow:hidden}#hpf{display:block;height:100%;width:100%;transition:width .15s}
#feed{position:fixed;right:12px;top:calc(56px + env(safe-area-inset-top));display:none;flex-direction:column;align-items:flex-end;gap:4px;z-index:3;font-size:13px;text-shadow:0 1px 3px #000}#feed div{background:rgba(0,0,0,.55);padding:3px 8px;border-right:3px solid var(--ac)}
#dead{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(120,0,0,.25),rgba(90,0,0,.88));z-index:4;text-align:center;pointer-events:none}
#dead h2{margin:0;font:italic 900 clamp(34px,8vw,64px) Impact,sans-serif;color:#ff3b30;letter-spacing:4px;text-shadow:0 0 22px #f00}#dead p{margin:6px 0}#dt{font:900 60px Impact,sans-serif}#dead small{letter-spacing:6px;color:#fbb}
.st{display:flex;align-items:center;gap:8px;font-size:11px;margin-top:5px}.st span{width:36px;color:#999}.st i{flex:1;height:6px;background:#2a2a2e;display:block}.st b{display:block;height:100%;background:var(--ac)}
.card.w{cursor:pointer}.card.sel{border-color:var(--ac);background:#24160a}.card.w>div,.card.w>span{flex:1}
.ctl{position:fixed;display:none;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid #fff;opacity:var(--o);transform:translate(-50%,-50%);touch-action:none;z-index:3;font-weight:700;font-size:12px;pointer-events:auto}
body.touch .ctl,body.edit .ctl{display:flex}
#joy{width:calc(130px*var(--s));height:calc(130px*var(--s))}
.ab{width:calc(70px*var(--s));height:calc(70px*var(--s))}
#fire{width:calc(86px*var(--s));height:calc(86px*var(--s));background:rgba(248,113,113,.4)}
#knob{width:40%;height:40%;border-radius:50%;background:#fff;pointer-events:none}
</style></head><body>
<div id="menu" class="scr on"><h1>SHARDEX<b>FPS</b><br>DUTY</h1><div id="box"></div></div>
<div id="hud">
 <div class="ctl" id="joy" data-c="joy"><div id="knob"></div></div>
 <div class="ctl" id="fire" data-c="fire">FIRE</div>
 <div class="ctl ab" data-c="jump" id="jump">JUMP</div>

</div>
<div id="cross"></div><div id="st"></div><div id="hurt"></div><div id="top"><div class="tb"><span id="bs">0</span><i><b id="bf"></b></i></div><div class="vs">FIRST TO <span id="lim">100</span></div><div class="tb"><i><b id="rf"></b></i><span id="rs">0</span></div></div><div id="hp"><div id="hpb"><b id="hpf"></b></div><span id="hpt">100</span></div><div id="feed"></div><div id="dead"><h2>ELIMINATED</h2><p id="dby"></p><div id="dt">3</div><small>RESPAWNING</small></div>

<div id="rot" class="scr"><svg viewBox="0 0 24 24" style="width:70px;height:70px"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M20 8a8 8 0 0 1 0 8M22 14l-2 2-2-2"/></svg><h3>Phone ko landscape me ghumao</h3><p class="m">Game sirf landscape me chalti hai.</p></div>

<script>
const $=s=>document.querySelector(s),B=document.body,isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;
const I={gun:'<path d="M3 10h13l2-3h3v4h-3l-1 3h-4l-1 4H8l1-4H3z"/>',shirt:'<path d="M8 3L3 6l2 4 3-1v11h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0z"/>',code:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',play:'<path d="M6 4l14 8-14 8z"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const G={pistol:{n:'Pistol',d:25,r:.35,p:1,sp:.01,pr:0,c:'#9ca3af'},rifle:{n:'Rifle',d:17,r:.11,p:1,sp:.03,pr:500,c:'#34d399'},shotgun:{n:'Shotgun',d:11,r:.9,p:8,sp:.12,pr:800,c:'#fb923c'},sniper:{n:'Sniper',d:90,r:1.3,p:1,sp:0,pr:1200,c:'#a78bfa'}};
const COL=['#22d3ee','#f472b6','#facc15','#4ade80','#f87171','#c084fc'];
const DP={joy:[14,68],fire:[86,62],jump:[93,38],slide:[78,82],sit:[66,84]};
const ACT=[['fwd','Forward'],['back','Back'],['left','Left'],['right','Right'],['jump','Jump'],['sprint','Sprint'],['slide','Slide'],['sit','Sit']];
const CODES={WELCOME:500,SHARDEX:1000,FPS2026:300};
let S={coins:1000,own:['pistol'],gun:'pistol',oc:[COL[0]],col:COL[0],user:null,friends:[],mode:'normal',sens:1,used:[],keys:{fwd:'KeyW',back:'KeyS',left:'KeyA',right:'KeyD',jump:'Space',sprint:'ShiftLeft',slide:'KeyC'},ui:{size:1,op:.6,pos:{}}};
try{Object.assign(S,JSON.parse(localStorage.getItem('arenafps')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('arenafps',JSON.stringify(S))}catch(e){}};S.chs=S.chs||[0];S.ch=S.ch||0;S.keys=Object.assign({sit:'KeyV'},S.keys);
let cfg={bots:7,kl:15},code='',rebind=null,edit=false;
function R(h,nb){view='orbit';if(sh){scene.remove(sh);sh=null}$('#box').innerHTML=h+(nb?'':`<p><button data-a="main">${ic('back')}Back</button></p>`)}
function main(){if(running){$('#menu').classList.remove('on');$('#pause').classList.add('on');return}R(`<div class="vmenu"><button class="big pri" data-a="start">${ic('play')}Start</button><button class="big" data-a="wo">${ic('gun')}Weapons</button><button class="big" data-a="cho">${ic('shirt')}Character</button><button class="big" data-a="code">${ic('code')}Code</button><button class="big" data-a="set">${ic('gear')}Setting</button></div><p class="m">Coins: ${S.coins}${S.user?' | '+S.user:''}</p>`,1)}
const gv=id=>$('#'+id).value;
const A={
main,
start(){R(`<div class="grid"><button class="big pri" data-a="ffa">Team Deathmatch</button><button class="big pri" data-a="multi">MULTIPLAYER</button></div><p class="m">Blue vs Red, bots ke saath. Har kill pe 5 points, jo team pehle 100 banaye wo jeete.</p>`)},
ffa(){launch({bots:9,kl:100})},
multi(){if(!S.user)return R(`<h3>Login</h3><p class="m">Multiplayer ke liye login zaroori hai.</p><input id="un" type="text" placeholder="Username" maxlength="14"><p><input id="pw" type="password" placeholder="PIN / Password"></p><button class="pri" data-a="login">Login / Register</button>`);
 R(`<h3>Hi ${S.user}</h3><div class="grid"><button class="big pri" data-a="join">Join</button><button class="big pri" data-a="create">Create</button><button class="big" data-a="friends">Friends</button></div>`)},
login(){const u=gv('un').trim();if(u.length<3||gv('pw').length<3)return alert('Username aur PIN kam se kam 3 characters.');S.user=u;save();A.multi()},
friends(){R(`<h3>Friends</h3>${S.friends.map((f,i)=>`<div class="card"><span>${f} <span class="m">offline</span></span><button data-a="delf" data-v="${i}">Remove</button></div>`).join('')||'<p class="m">Abhi koi friend nahi.</p>'}<input id="fn" type="text" placeholder="Friend username" maxlength="14"><p><button class="pri" data-a="addf">Add friend</button></p><p class="m">Friend list abhi is device me save hoti hai.</p>`)},
addf(){const f=gv('fn').trim();if(f.length>=3&&!S.friends.includes(f)){S.friends.push(f);save()}A.friends()},
delf(i){S.friends.splice(i,1);save();A.friends()},
create(){R(`<h3>Create room</h3><div class="card"><span>Bots</span><input id="cb" type="checkbox" checked></div><div class="card"><span>Bot count</span><input id="cn" type="range" min="2" max="10" value="9"></div><div class="card"><span>Score limit</span><select id="ck"><option>50</option><option selected>100</option><option>150</option></select></div><button class="pri" data-a="mk">Create</button>`)},
mk(){cfg={bots:$('#cb').checked?+gv('cn'):0,kl:+gv('ck')};code=Math.random().toString(36).slice(2,7).toUpperCase();A.lobby()},
join(){R(`<h3>Join room</h3><input id="jc" type="text" placeholder="Room code" maxlength="5"><p><button class="pri" data-a="jn">Join</button></p>`)},
jn(){const c=gv('jc').trim().toUpperCase();if(c.length<3)return;code=c;cfg={bots:9,kl:100};A.lobby()},
lobby(){const names=['Rex','Nova','Kilo','Zed','Vex','Ace','Bolt','Jinx','Echo','Fang'];R(`<h3>Room: ${code}</h3><div class="card"><span><span class="dot" style="background:${S.col}"></span>${S.user} (You)</span></div>${names.slice(0,cfg.bots).map((n,i)=>`<div class="card"><span><span class="dot" style="background:${i<(cfg.bots>>1)?'#2f6fe0':'#e03a2f'}"></span>${n} <span class="m">bot</span></span></div>`).join('')}<p class="m">Score limit: ${cfg.kl} (Blue vs Red)</p><button class="pri" data-a="go">Start match</button>`)},
go(){launch(cfg)},
weap(){R(`<h3>Weapons <span class="m">(${S.coins} coins)</span></h3>${Object.entries(G).map(([k,g])=>`<div class="card"><span><b>${g.n}</b><br><span class="m">Dmg ${g.d} x${g.p} | rate ${g.r}s</span></span><button class="${S.gun==k?'act':''}" data-a="gun" data-v="${k}">${S.own.includes(k)?(S.gun==k?'Equipped':'Equip'):'Buy '+g.pr}</button></div>`).join('')}`)},
gun(k){if(!S.own.includes(k)){if(S.coins<G[k].pr)return alert('Coins kam hain');S.coins-=G[k].pr;S.own.push(k)}S.gun=k;save();A.weap()},
ward(){R(`<h3>Wardrobe <span class="m">(${S.coins} coins)</span></h3>${COL.map((c,i)=>`<div class="card"><span><span class="dot" style="background:${c}"></span>Skin ${i+1}</span><button class="${S.col==c?'act':''}" data-a="skin" data-v="${c}">${S.oc.includes(c)?(S.col==c?'Equipped':'Equip'):'Buy '+i*200}</button></div>`).join('')}`)},
skin(c){const p=COL.indexOf(c)*200;if(!S.oc.includes(c)){if(S.coins<p)return alert('Coins kam hain');S.coins-=p;S.oc.push(c)}S.col=c;save();A.ward()},
code(){R(`<h3>Redeem code</h3><input id="rc" type="text" placeholder="Enter code"><p><button class="pri" data-a="redeem">Redeem</button></p>`)},
redeem(){const c=gv('rc').trim().toUpperCase();if(CODES[c]&&!S.used.includes(c)){S.coins+=CODES[c];S.used.push(c);save();alert('+'+CODES[c]+' coins!')}else alert('Invalid ya already used code');A.code()},
set(){R(`<h3>Controls</h3><div class="grid"><button class="${S.mode=='normal'?'act':''}" data-a="mode" data-v="normal">Normal control</button><button class="${S.mode=='full'?'act':''}" data-a="mode" data-v="full">Full control</button></div><p class="m">Normal: enemy ke paas aim jaye to auto-assist (Free Fire jaisa). Full: assist off, poora manual aim.</p><div class="card"><span>Sensitivity</span><input type="range" data-i="sens" min=".3" max="2.5" step=".1" value="${S.sens}"></div><h3>PC keys</h3><div class="grid">${ACT.map(([a,n])=>`<button data-a="bind" data-v="${a}">${n}: ${rebind==a?'press key...':S.keys[a].replace('Key','')}</button>`).join('')}</div><p class="m">Fire = Left Click</p><h3>Mobile buttons</h3><div class="card"><span>Size</span><input type="range" data-i="size" min=".6" max="1.6" step=".1" value="${S.ui.size}"></div><div class="card"><span>Transparency</span><input type="range" data-i="op" min=".15" max="1" step=".05" value="${S.ui.op}"></div><button data-a="edit">Move buttons</button>`)},
mode(v){S.mode=v;save();A.set()},
bind(a){rebind=a;A.set()},
edit(){edit=true;$('#menu').classList.remove('on');B.classList.add('edit')},
done(){edit=false;B.classList.remove('edit');$('#menu').classList.add('on');save();A.set()},
resume(){$('#pause').classList.remove('on');try{ren.domElement.requestPointerLock()}catch(e){}},
quit(){endGame(null)}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a])A[a.dataset.a](a.dataset.v)});
document.addEventListener('input',e=>{const k=e.target.dataset.i;if(!k)return;if(k=='sens')S.sens=+e.target.value;if(k=='size')S.ui.size=+e.target.value;if(k=='op')S.ui.op=+e.target.value;applyUI();save()});
function applyUI(){const r=document.documentElement.style;r.setProperty('--s',S.ui.size);r.setProperty('--o',S.ui.op);for(const c in DP){const p=S.ui.pos[c]||DP[c],el=$('[data-c='+c+']');el.style.left=p[0]+'%';el.style.top=p[1]+'%'}}
let drag=null;
document.addEventListener('pointerdown',e=>{if(!edit)return;const el=e.target.closest('[data-c]');if(el)drag=el});
document.addEventListener('pointermove',e=>{if(drag){S.ui.pos[drag.dataset.c]=[Math.max(4,Math.min(96,e.clientX/innerWidth*100)),Math.max(6,Math.min(94,e.clientY/innerHeight*100))];applyUI()}});
document.addEventListener('pointerup',()=>{drag=null});

const keys={},tch={},rc=new THREE.Raycaster(),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),K=a=>keys[S.keys[a]]?1:0;
function oldInit(){ren=new THREE.WebGLRenderer({antialias:false});ren.setPixelRatio(Math.min(devicePixelRatio,2));B.prepend(ren.domElement);
 scene=new THREE.Scene();scene.background=new THREE.Color('#7dd3fc');scene.fog=new THREE.Fog('#7dd3fc',30,90);
 cam=new THREE.PerspectiveCamera(75,1,.1,200);cam.rotation.order='YXZ';scene.add(cam);
 scene.add(new THREE.HemisphereLight('#ffffff','#556677',1));const sun=new THREE.DirectionalLight('#ffffff',.6);sun.position.set(20,40,10);scene.add(sun);
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshLambertMaterial({color:'#3f6b4f'}));fl.rotation.x=-Math.PI/2;scene.add(fl);
 let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
 for(let i=0;i<18;i++){const w=.8+rnd()*1.6,d=.8+rnd()*1.6,h=1.5+rnd()*3,x=(rnd()-.5)*70,z=(rnd()-.5)*70;if(Math.hypot(x,z)<7)continue;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w*2,h,d*2),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(rnd(),.3,.5)}));m.position.set(x,h/2,z);scene.add(m);obst.push(m);boxes.push({x,z,w,d,h})}
 [[0,-40,80,1],[0,40,80,1],[-40,0,1,80],[40,0,1,80]].forEach(([x,z,w,d])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,6,d),new THREE.MeshLambertMaterial({color:'#475569'}));m.position.set(x,3,z);scene.add(m);obst.push(m)});
 vm=new THREE.Mesh(new THREE.BoxGeometry(.1,.12,.6),new THREE.MeshLambertMaterial({color:'#999'}));vm.position.set(.25,-.22,-.5);cam.add(vm);
 vh=new THREE.Mesh(new THREE.BoxGeometry(.14,.14,.2),new THREE.MeshLambertMaterial({color:'#fff'}));vh.position.set(.25,-.28,-.3);cam.add(vh);
 resize()}
let vmg,mf,mfl,kick=0,mfT=0,fx=[],AC;
